name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Luacheck
        uses: lunarmodules/luacheck@v1
        with:
          args: "."

  release:
    needs: lint
    runs-on: ubuntu-latest

    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
        with:
          # File: PardonasBuffReminder-X.Y.Z.zip, CurseForge label: "Pardona's Buff Reminder X.Y.Z"
          args: >-
            -n "{package-name}-{project-version}:Pardona's Buff Reminder {project-version}"
