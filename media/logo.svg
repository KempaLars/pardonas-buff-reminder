<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#2a1d4f"/>
      <stop offset="55%" stop-color="#140d2b"/>
      <stop offset="100%" stop-color="#07050f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d6" stop-opacity="1"/>
      <stop offset="35%" stop-color="#ffd36b" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#e08a1e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e08a1e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="disc" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#3b2a6e"/>
      <stop offset="100%" stop-color="#120b26"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1b8"/>
      <stop offset="45%" stop-color="#f2c14e"/>
      <stop offset="100%" stop-color="#a8681a"/>
    </linearGradient>
    <linearGradient id="chev" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ffe7a0"/>
      <stop offset="100%" stop-color="#f0a93a"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7a4a"/>
      <stop offset="100%" stop-color="#b8261a"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="400" height="400" rx="56"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="400" height="400" fill="url(#bg)"/>

    <!-- Lichtstrahlen -->
    <g transform="translate(200 208)" opacity="0.18" fill="#ffd36b">
      <g id="ray"><polygon points="-7,0 7,0 0,-215"/></g>
      <use href="#ray" transform="rotate(22.5)"/><use href="#ray" transform="rotate(45)"/>
      <use href="#ray" transform="rotate(67.5)"/><use href="#ray" transform="rotate(90)"/>
      <use href="#ray" transform="rotate(112.5)"/><use href="#ray" transform="rotate(135)"/>
      <use href="#ray" transform="rotate(157.5)"/><use href="#ray" transform="rotate(180)"/>
      <use href="#ray" transform="rotate(202.5)"/><use href="#ray" transform="rotate(225)"/>
      <use href="#ray" transform="rotate(247.5)"/><use href="#ray" transform="rotate(270)"/>
      <use href="#ray" transform="rotate(292.5)"/><use href="#ray" transform="rotate(315)"/>
      <use href="#ray" transform="rotate(337.5)"/>
    </g>

    <!-- Aura-Glühen -->
    <circle cx="200" cy="208" r="165" fill="url(#glow)" opacity="0.55"/>
  </g>

  <!-- Emblem -->
  <g filter="url(#shadow)">
    <circle cx="200" cy="208" r="132" fill="url(#gold)"/>
    <circle cx="200" cy="208" r="120" fill="#1b1233"/>
    <circle cx="200" cy="208" r="114" fill="url(#gold)"/>
    <circle cx="200" cy="208" r="108" fill="url(#disc)"/>
  </g>

  <!-- Runenpunkte auf dem Ring -->
  <g transform="translate(200 208)" fill="#1b1233">
    <g id="dot"><path d="M0,-126 l4,6 -4,6 -4,-6z"/></g>
    <use href="#dot" transform="rotate(45)"/><use href="#dot" transform="rotate(90)"/>
    <use href="#dot" transform="rotate(135)"/><use href="#dot" transform="rotate(180)"/>
    <use href="#dot" transform="rotate(225)"/><use href="#dot" transform="rotate(270)"/>
    <use href="#dot" transform="rotate(315)"/>
  </g>

  <!-- inneres Leuchten -->
  <circle cx="200" cy="208" r="80" fill="url(#glow)" opacity="0.5" filter="url(#soft)"/>

  <!-- Buff-Pfeile -->
  <g filter="url(#shadow)">
    <path d="M200 132 L262 194 L238 218 L200 180 L162 218 L138 194 Z" fill="url(#chev)" stroke="#7a4a10" stroke-width="3" stroke-linejoin="round"/>
    <path d="M200 192 L262 254 L238 278 L200 240 L162 278 L138 254 Z" fill="url(#chev)" stroke="#7a4a10" stroke-width="3" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- Erinnerungs-Glocke -->
  <g transform="translate(312 92)" filter="url(#shadow)">
    <circle r="50" fill="url(#gold)"/>
    <circle r="43" fill="url(#badge)"/>
    <g fill="#fff8e6">
      <path d="M0,-27 c-3,0 -5,2 -5,5 v1.5 c-11,3 -17,12 -17,24 v10 l-7,8 v3 h58 v-3 l-7,-8 v-10 c0,-12 -6,-21 -17,-24 v-1.5 c0,-3 -2,-5 -5,-5z"/>
      <path d="M-8,27 a8,8 0 0 0 16,0z"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
